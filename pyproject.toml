[project]
name = "senate-race"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=7.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "scipy>=1.13.0",
    "streamlit>=1.35.0",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# build.py is a legacy generator of the 30 Oct project files; it is not part of the app.
extend-exclude = ["build.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "D"]
# E731: short lambdas assigned to names are this codebase's idiom for local helpers.
ignore = ["E731", "D107"]  # D107: __init__ args are documented in the class docstring (Google style)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
